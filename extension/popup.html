<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DRBR YouTube sync</title>
  <style>
    body { font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; width: 360px; margin: 12px; color: #222; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    label { display: block; margin: 6px 0 2px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 4px 6px; }
    .row { display: flex; gap: 8px; margin-top: 8px; }
    button { padding: 6px 10px; cursor: pointer; }
    #sync { font-weight: 700; flex: 1; }
    details { margin-bottom: 8px; }
    .panel { margin-top: 12px; padding: 8px; border-radius: 4px; border: 1px solid #ccc; background: #fafafa; }
    .panel.failed { border: 2px solid #b00020; background: #fdecee; }
    .panel.failed .title { color: #b00020; font-size: 15px; }
    .panel.partial { border: 2px solid #b26a00; background: #fff4e0; }
    .panel.ok { border: 1px solid #2e7d32; background: #edf7ee; }
    .title { font-weight: 700; margin-bottom: 4px; }
    ul { margin: 4px 0 0 16px; padding: 0; max-height: 160px; overflow: auto; }
    .muted { color: #666; font-size: 12px; }
    #saved { color: #2e7d32; align-self: center; }
  </style>
</head>
<body>
  <h1>DRBR — YouTube history</h1>
  <details id="settings">
    <summary>Backend settings</summary>
    <label for="backendUrl">Backend URL</label>
    <input id="backendUrl" type="url" placeholder="http://127.0.0.1:8750">
    <label for="token">Ingest token (DRBR_INGEST_TOKEN)</label>
    <input id="token" type="password" autocomplete="off">
    <label for="pageCap">Page cap</label>
    <input id="pageCap" type="number" min="1" max="30" placeholder="8">
    <div class="row"><button id="save">Save</button><span id="saved"></span></div>
  </details>
  <div class="row"><button id="sync">Run weekly sync</button></div>
  <div id="status" class="panel"><span class="muted">No sync run yet.</span></div>
  <script src="popup.js"></script>
</body>
</html>
